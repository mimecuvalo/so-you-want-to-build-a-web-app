[install]
# Hoisted rather than isolated: under the isolated global store, @vitejs/plugin-react can't resolve
# its `vite` peer. Overrides ~/.bunfig.toml.
linker = "hoisted"
# Pin exact versions on `bun add`.
exact = true
# Supply-chain age gate: don't install package versions published less than
# 3 days (259200s) ago, so freshly-compromised releases can't be pulled in.
minimumReleaseAge = 259200
